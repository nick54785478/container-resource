input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 這裡可以撰寫過濾或清洗邏輯 (例如解析日期、擷取特定欄位)
  # 目前先保持空白，讓原始 Log 直接通過
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  
  # 同時印出在終端機，方便本地開發 Debug
  stdout {
    codec => rubydebug
  }
}